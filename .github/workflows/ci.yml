name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
    env:
      DEEPSEEK_API_KEY: ci-dummy-not-a-real-key
      PYTHON_DOTENV_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Set up uv and Python
        uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - name: Install locked dependencies
        run: uv sync --locked
      - name: Lint and compile
        run: |
          uv run --locked ruff check src tests tui.py
          uv run --locked python -m compileall -q src
      - name: Tests (offline, against the fake model server)
        run: uv run --locked pytest -q
      - name: Check tool schemas and CLI offline
        run: |
          uv run --locked python -c "from mini_harness.agent import DeepSeekAgent; from mini_harness.tool.box import TOOLS; assert len(DeepSeekAgent(TOOLS).tools) == 9"
          uv run --locked mini-harness --help
          MINI_HARNESS_PROFILE=bench uv run --locked mini-harness --help
      - name: Check TUI entry point offline
        run: uv run --script tui.py --help
      - name: Build package
        run: uv build
